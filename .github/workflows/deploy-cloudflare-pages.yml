name: Deploy TutorApp to Cloudflare Pages

# Mirrors deploy-tutorapp.yml's build, published to Cloudflare Pages instead
# of (not replacing) GitHub Pages — Cloudflare's network tends to be more
# reliably reachable from Russia than GitHub's, which some tutees report
# trouble with. Requires two repo secrets this workflow can't set up itself:
# CLOUDFLARE_API_TOKEN (an API token with "Account > Cloudflare Pages >
# Edit" permission) and CLOUDFLARE_ACCOUNT_ID (from the Cloudflare
# dashboard's account overview page). Until both exist, this workflow's runs
# fail — harmlessly, since it's independent of the GitHub Pages deploy.
on:
  push:
    branches: [main]
    paths:
      - "TutorApp/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TutorApp/package-lock.json

      - name: Install dependencies
        working-directory: TutorApp
        run: npm ci

      - name: Build
        working-directory: TutorApp
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      # wrangler pages deploy creates the "tutorspace" project automatically
      # on its first run if it doesn't exist yet — no separate setup step on
      # the Cloudflare dashboard is needed first.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy TutorApp/dist --project-name=tutorspace
