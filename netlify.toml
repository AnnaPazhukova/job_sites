[build]
  base = "TutorApp"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy Supabase through this site's own origin, so visitors whose ISP
# throttles or blocks *.supabase.co only talk to the Netlify domain. Enabled
# by building with VITE_SUPABASE_URL=/supabase. Must stay above the SPA rule.
[[redirects]]
  from = "/supabase/*"
  to = "https://ycwwbifcogoisnxkkgtw.supabase.co/:splat"
  status = 200
  force = true

# Single-page app: any unknown path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
